<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <!-- Jobsheet 3: Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIMUS Mini - Tambah Anggota</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="navbar">

            <div class="logo">
                <h1>SIMUS Mini</h1>
            </div>

            <!-- Jobsheet 3: Hamburger Menu -->
            <input type="checkbox" id="menu-toggle">

            <label for="menu-toggle" class="hamburger">
                ☰
            </label>

            <nav>
                <a href="../index.html">Beranda</a>
                <a href="../buku/list.html">Daftar Buku</a>
                <a href="../buku/tambah.html">Tambah Buku</a>
                <a href="list.html">Daftar Anggota</a>
                <a href="tambah.html">Tambah Anggota</a>
            </nav>

        </div>

    </header>

    <!-- MAIN -->
    <main>

        <section>

            <h2>Tambah Anggota</h2>

            <p>
                Silakan isi form berikut untuk menambahkan
                data anggota baru.
            </p>

            <form>

                <div class="form-group">

                    <label for="nama">
                        Nama
                    </label>

                    <input
                        type="text"
                        id="nama"
                        name="nama"
                        placeholder="Masukkan nama anggota"
                    >

                </div>

                <div class="form-group">

                    <label for="nomor">
                        Nomor Anggota
                    </label>

                    <input
                        type="text"
                        id="nomor"
                        name="nomor"
                        placeholder="Contoh: AG004"
                    >

                </div>

                <div class="form-group">

                    <label for="alamat">
                        Alamat
                    </label>

                    <textarea
                        id="alamat"
                        name="alamat"
                        rows="4"
                        placeholder="Masukkan alamat anggota"
                    ></textarea>

                </div>

                <div class="form-group">

                    <label for="hp">
                        Nomor HP
                    </label>

                    <input
                        type="tel"
                        id="hp"
                        name="hp"
                        placeholder="Masukkan nomor HP"
                    >

                </div>

                <button type="submit">
                    Simpan
                </button>

                <button type="reset">
                    Reset
                </button>

            </form>

        </section>

    </main>

    <!-- FOOTER -->
    <footer>

        <p>&copy; 2026 SIMUS Mini | Jobsheet 3</p>

    </footer>

</body>

</html>
