<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TOKO-Lite | Daftar Pelanggan</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <header>
        <h1>TOKO-Lite</h1>

        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>

        <nav>

    <main>
        <section>
            <h2>Daftar Pelanggan</h2>

            <div class="search-box">
                <label for="search-input">Cari Nama Pelanggan</label>
                <input type="text" id="search-input" placeholder="Ketik nama pelanggan...">
            </div>

            <p id="loading-indicator" style="display:none;">Memuat data...</p>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID Pelanggan</th>
                            <th>Nama</th>
                            <th>Kota</th>
                            <th>No. HP</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data dimuat lewat pelanggan.js -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 TOKO-Lite &mdash; Jobsheet Rombakan</p>
