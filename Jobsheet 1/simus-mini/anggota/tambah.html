<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMUS Mini - Tambah Anggota</title>
</head>

<body>

    <header>
        <h1>SIMUS Mini</h1>

        <nav>
            <a href="../index.html">Beranda</a> |
            <a href="../buku/list.html">Daftar Buku</a> |
            <a href="../buku/tambah.html">Tambah Buku</a> |
            <a href="list.html">Daftar Anggota</a> |
            <a href="tambah.html">Tambah Anggota</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Form Tambah Anggota</h2>

            <form action="#" method="post">

                <p>
                    <label for="nama">Nama</label>
                    <br>
                    <input
                        type="text"
                        id="nama"
                        name="nama"
                        required
                    >
                </p>

                <p>
                    <label for="no_anggota">Nomor Anggota</label>
                    <br>
                    <input
                        type="text"
                        id="no_anggota"
                        name="no_anggota"
                        required
                    >
                </p>

                <p>
                    <label for="alamat">Alamat</label>
                    <br>
                    <textarea
                        id="alamat"
                        name="alamat"
                        rows="4"
                        required
                    ></textarea>
                </p>

                <p>
                    <label for="no_hp">Nomor HP</label>
                    <br>
                    <input
                        type="tel"
                        id="no_hp"
                        name="no_hp"
                        required
                    >
                </p>

                <button type="submit">Simpan Anggota</button>
                <button type="reset">Reset</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 SIMUS Mini</p>
    </footer>

</body>
</html>
