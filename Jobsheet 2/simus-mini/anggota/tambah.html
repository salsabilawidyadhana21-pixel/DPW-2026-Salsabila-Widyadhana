<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tambah Anggota - SIMUS Mini</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <!-- Header dan Navbar -->
    <header>
        <div class="navbar">

            <div class="logo">
                <h1>SIMUS Mini</h1>
            </div>

            <!-- Jobsheet 3: Hamburger Menu -->
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
            <label for="menu-toggle" class="hamburger">☰</label>

            <nav>
                <a href="../index.html">Beranda</a>
                <a href="../buku/list.html">Daftar Buku</a>
                <a href="../buku/tambah.html">Tambah Buku</a>
                <a href="list.html">Daftar Anggota</a>
                <a href="tambah.html">Tambah Anggota</a>
            </nav>

        </div>
    </header>


    <main>

        <section>

            <h2>Tambah Anggota</h2>

            <!-- Jobsheet 3: Form responsive -->
            <form>

                <div class="form-group">
                    <label for="nama">Nama Anggota</label>
                    <input type="text" id="nama" name="nama"
                        placeholder="Masukkan nama anggota">
                </div>

                <div class="form-group">
                    <label for="idanggota">ID Anggota</label>
                    <input type="text" id="idanggota" name="idanggota"
                        placeholder="Contoh: AG004">
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat</label>
                    <textarea id="alamat" name="alamat"
                        placeholder="Masukkan alamat anggota"></textarea>
                </div>

                <div class="form-group">
                    <label for="telepon">No. Telepon</label>
                    <input type="tel" id="telepon" name="telepon"
                        placeholder="Masukkan nomor telepon">
                </div>

                <button type="submit">Simpan Anggota</button>

            </form>

        </section>

    </main>


    <footer>
        <p>© 2026 SIMUS Mini | Jobsheet 3</p>
    </footer>

</body>

</html>
