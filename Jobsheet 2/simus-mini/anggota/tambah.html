<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tambah Anggota</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <header>
        <div class="navbar">

            <div class="logo">
                <h1>SIMUS Mini</h1>
            </div>

            <nav>
                <a href="../index.html">Beranda</a>
                <a href="../buku/list.html">Daftar Buku</a>
                <a href="../buku/tambah.html">Tambah Buku</a>
                <a href="list.html">Daftar Anggota</a>
                <a href="tambah.html">Tambah Anggota</a>
            </nav>

        </div>
    </header>

    <main>

        <section>

            <h2>Form Tambah Anggota</h2>

            <form>

                <div class="form-group">
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" name="nama">
                </div>

                <div class="form-group">
                    <label for="nomor">Nomor Anggota</label>
                    <input type="text" id="nomor" name="nomor">
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat</label>
                    <textarea id="alamat" name="alamat" rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label for="hp">Nomor HP</label>
                    <input type="text" id="hp" name="hp">
                </div>

                <button type="submit">Simpan</button>
                <button type="reset">Reset</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 SIMUS Mini | Jobsheet 2</p>
    </footer>

</body>

</html>
