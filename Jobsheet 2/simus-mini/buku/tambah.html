<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tambah Buku - SIMUS Mini</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <!-- Header dan Navbar -->
    <header>
        <div class="navbar">

            <div class="logo">
                <h1>SIMUS Mini</h1>
            </div>

            <!-- Jobsheet 3: Hamburger Menu -->
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
            <label for="menu-toggle" class="hamburger">☰</label>

            <nav>
                <a href="../index.html">Beranda</a>
                <a href="list.html">Daftar Buku</a>
                <a href="tambah.html">Tambah Buku</a>
                <a href="../anggota/list.html">Daftar Anggota</a>
                <a href="../anggota/tambah.html">Tambah Anggota</a>
            </nav>

        </div>
    </header>


    <main>

        <section>

            <h2>Tambah Buku</h2>

            <!-- Jobsheet 3: Form dibuat responsive -->
            <form>

                <div class="form-group">
                    <label for="judul">Judul Buku</label>
                    <input type="text" id="judul" name="judul" placeholder="Masukkan judul buku">
                </div>

                <div class="form-group">
                    <label for="penulis">Penulis</label>
                    <input type="text" id="penulis" name="penulis" placeholder="Masukkan nama penulis">
                </div>

                <div class="form-group">
                    <label for="tahun">Tahun Terbit</label>
                    <input type="number" id="tahun" name="tahun" placeholder="Masukkan tahun terbit">
                </div>

                <div class="form-group">
                    <label for="stok">Stok</label>
                    <input type="number" id="stok" name="stok" placeholder="Masukkan jumlah stok">
                </div>

                <button type="submit">Simpan Buku</button>

            </form>

        </section>

    </main>


    <footer>
        <p>© 2026 SIMUS Mini | Jobsheet 3</p>
    </footer>

</body>

</html>
